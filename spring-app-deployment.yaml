apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app: spring-app
  labels:
    app: spring-app
  name: spring-app
spec:
  selector:
    matchLabels:
      app: spring-app
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/v1/auth/"
        app: spring-app
      creationTimestamp: null
      labels:
        app: spring-app
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - env:
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/bookstore
            - name: SPRING_DATASOURCE_USERNAME
              value: newuser
          image: bookstore-springboot-spring-app:latest
          imagePullPolicy: Never
          name: spring-app-container
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 514Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /api/v1/auth/
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/auth/
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/auth/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
      serviceAccountName: ""
      volumes: null
status: {}
